faq:
  - question: プログラミング未経験でも参加できますか？
    answer: できます。未経験・初心者の方を歓迎しています。チーム編成は運営が行い、経験者と一緒のチームになるよう調整します。
  - question: 1日だけの参加はできますか？
    answer: 宿泊を伴う合宿形式のため、原則2日間通しでのご参加をお願いしています。
  - question: 何を持っていけばいいですか？
    answer: PC（必須）、充電器・延長コード、洗面用具・着替え・タオル、開発に必要なものをお持ちください。宿泊施設に泊まる想定でご準備ください。
  - question: 食事はどうなりますか？
    answer: 2日間の食事はすべて施設の食堂でご用意します。参加費に含まれるため追加費用はかかりません。食物アレルギーがある方は事前にお知らせください。
  - question: お酒は飲めますか？
    answer: 施設内での飲酒は厳禁です。打ち上げは別イベントとして予定しています。
  - question: チームは自分で組みますか？
    answer: いいえ、チーム編成は運営側で行います。学生と社会人が混ざるように調整します。
notes:
  - 宿泊を伴う合宿形式のイベントです。原則2日間通しでのご参加をお願いします。
  - 施設内での飲酒は厳禁です。
  - 喫煙は指定場所でお願いします。
  - 外部からの飲食物の持ち込みには制限があります。
  - 食物アレルギーのある方は、お申し込み時に必ずお知らせください。
  - 直前キャンセルはご遠慮ください。やむを得ない場合は早めにご連絡ください。
