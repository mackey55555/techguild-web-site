targets:
  - title: プログラミング未経験・初心者
    description: チームには経験者が入ります。手を動かしながら覚えられるので、今できることが少なくても大丈夫です。
  - title: 学生と社会人が混ざるチームで開発したい
    description: チーム編成は運営が行います。ふだん出会えない相手と組むところから始まります。
  - title: 地域×ITに興味がある
    description: 実際にその場所に泊まり、街を見てからつくる。机上の空論にならない2日間です。
  - title: 合宿形式の開発を体験したい
    description: 朝から夜まで、同じ場所で同じものをつくる。短期集中でしか得られない密度があります。
