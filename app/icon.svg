<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- 背景は透過。タブバーの明暗で文字色を切り替える
       （明: フォレスト #1C3829 / 暗: ゴールド #F0C93A）
       字形は見出しと同じ Playfair Display Black をラスタライズして埋め込み、
       閲覧環境のフォントに依存しないようにしている。 -->
  <style>
    .dark { display: none }
    @media (prefers-color-scheme: dark) {
      .light { display: none }
      .dark { display: inline }
    }
  </style>
  <image class="light" width="160" height="160" href="data:image/png;base64,"/>
  <image class="dark" width="160" height="160" href="data:image/png;base64,"/>
</svg>
